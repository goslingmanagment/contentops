# ContentOps stack (SPEC §12.1): seven services, five of them from one image (`app` stage of
# the root Dockerfile); `proxy` is nginx with the built interface, `db` is PostgreSQL 18.
# Start, mounts and the wait for /healthz: ops/up.sh. Settings and secrets: .env (0600),
# every variable is listed in .env.example. Ports: only nginx, on host loopback.
name: contentops

x-app: &app
  image: contentops-app:local
  build:
    context: .
    target: app
  restart: unless-stopped
  # Owner of /srv/* in the VM (ops/vm/setup-disks.sh).
  user: "1000:1000"
  init: true
  networks: [stack]

x-app-env: &app-env
  TZ: UTC
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgres://contentops_app:${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}@db:5432/contentops
  DATA_ROOT: /srv/content
  DERIVED_ROOT: /srv/derived
  TMP_ROOT: /srv/tmp
  # Part of the master recipe: every role computes the same pipeline version (SPEC §9.1).
  SVTAV1_LP: ${SVTAV1_LP:-4}
  # A bind mount always looks mounted inside a container: the volume mark of ops/up.sh is
  # the check (health.ts). Without it /healthz is red and the workers wait.
  REQUIRE_VOLUMES: /srv/content,/srv/derived,/srv/tmp

x-storage: &storage
  - ${DATA_ROOT:-/srv/content}:/srv/content
  - ${DERIVED_ROOT:-/srv/derived}:/srv/derived
  - ${TMP_ROOT:-/srv/tmp}:/srv/tmp

services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    user: "1000:1000"
    networks: [stack]
    environment:
      TZ: UTC
      PGTZ: UTC
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      MIGRATE_DB_PASSWORD: ${MIGRATE_DB_PASSWORD:?set MIGRATE_DB_PASSWORD in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
    volumes:
      # PostgreSQL 18 images keep data in /var/lib/postgresql/18/docker.
      - ${DB_ROOT:-/srv/db}:/var/lib/postgresql
      - ./ops/db/init-roles.sh:/docker-entrypoint-initdb.d/10-roles.sh:ro
    shm_size: 256m
    stop_grace_period: 60s
    oom_score_adj: -500
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d contentops -q"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 60s

  # One-shot: migrations under the advisory lock as the schema owner; the others start after
  # it succeeds and never migrate themselves.
  migrate:
    <<: *app
    restart: "no"
    environment:
      TZ: UTC
      ROLE: migrate
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MIGRATE_DATABASE_URL: postgres://contentops_migrate:${MIGRATE_DB_PASSWORD:?set MIGRATE_DB_PASSWORD in .env}@db:5432/contentops
    depends_on:
      db:
        condition: service_healthy

  web:
    <<: *app
    environment:
      <<: *app-env
      ROLE: web
      HOST: 0.0.0.0
      PORT: "3000"
      PUBLIC_URL: ${PUBLIC_URL:?set PUBLIC_URL in .env}
      TRUSTED_PROXY: loopback,${STACK_SUBNET:-10.77.10.0/24}
      HOST_SPACE_FILE: /host/space.json
      SPACE_WARN_GB: ${SPACE_WARN_GB:-200}
      SPACE_STOP_GB: ${SPACE_STOP_GB:-100}
      # Cloud sources (SPEC §6.1): `sources.credentials_ref` names the variable.
      YDISK_TOKEN: ${YDISK_TOKEN:-}
      DROPBOX_REFRESH_TOKEN: ${DROPBOX_REFRESH_TOKEN:-}
      DROPBOX_APP_KEY: ${DROPBOX_APP_KEY:-}
      DROPBOX_APP_SECRET: ${DROPBOX_APP_SECRET:-}
      HUB_BASE_URL: ${HUB_BASE_URL:-}
      HUB_API_KEY: ${HUB_API_KEY:-}
    volumes:
      - ${DATA_ROOT:-/srv/content}:/srv/content
      - ${DERIVED_ROOT:-/srv/derived}:/srv/derived
      - ${TMP_ROOT:-/srv/tmp}:/srv/tmp
      # Read-only share of the host; automounted, so the mount must propagate (rslave).
      # MOUNT_PROPAGATION=rprivate only for a local stack on Docker Desktop, which has no rslave.
      - type: bind
        source: ${HOST_SHARE:-/mnt/host}
        target: /host
        read_only: true
        bind:
          propagation: ${MOUNT_PROPAGATION:-rslave}
          create_host_path: false
    oom_score_adj: -200
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Light kinds: intake from the source, import, Hub; the periodic scheduler lives here.
  worker:
    <<: *app
    command: ["nice", "-n", "5", "node", "dist/main.js"]
    environment:
      <<: *app-env
      ROLE: worker
      FETCH_JOBS: ${FETCH_JOBS:-4}
      FETCH_AHEAD_GB: ${FETCH_AHEAD_GB:-25}
      # Intake stops below SPACE_STOP_GB of free C: (SPEC §12.2).
      HOST_SPACE_FILE: /host/space.json
      SPACE_STOP_GB: ${SPACE_STOP_GB:-100}
      # Cloud sources (SPEC §6.1): `sources.credentials_ref` names the variable.
      YDISK_TOKEN: ${YDISK_TOKEN:-}
      DROPBOX_REFRESH_TOKEN: ${DROPBOX_REFRESH_TOKEN:-}
      DROPBOX_APP_KEY: ${DROPBOX_APP_KEY:-}
      DROPBOX_APP_SECRET: ${DROPBOX_APP_SECRET:-}
      HUB_BASE_URL: ${HUB_BASE_URL:-}
      HUB_API_KEY: ${HUB_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # The old corpus (SPEC §6.3): the local Я.Диск copy, read only where its Windows list
      # says the bytes are on disk; everything is copied into /srv/tmp before any processing.
      LEGACY_SOURCE_ROOT: /ydisk
      LEGACY_COPY_LIST: /host/ydisk-copy-list.jsonl
    volumes:
      - ${DATA_ROOT:-/srv/content}:/srv/content
      - ${DERIVED_ROOT:-/srv/derived}:/srv/derived
      - ${TMP_ROOT:-/srv/tmp}:/srv/tmp
      # Free space of the host (read-only), like web.
      - type: bind
        source: ${HOST_SHARE:-/mnt/host}
        target: /host
        read_only: true
        bind:
          propagation: ${MOUNT_PROPAGATION:-rslave}
          create_host_path: false
      # The Я.Диск copy (cifs ro, automount in the VM): read only, never written.
      - type: bind
        source: ${LEGACY_COPY:-/mnt/ydisk}
        target: /ydisk
        read_only: true
        bind:
          propagation: ${MOUNT_PROPAGATION:-rslave}
          create_host_path: false
    cpu_shares: 512
    oom_score_adj: 300
    # Running works go back to the queue on stop (WorkRunner.stop waits up to 30 s).
    stop_grace_period: 45s
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Encoders: lower priority and a CPU quota, one core always free for web (SPEC §12.0).
  worker-video:
    <<: *app
    command: ["nice", "-n", "10", "node", "dist/main.js"]
    environment:
      <<: *app-env
      ROLE: worker-video
      ENCODE_JOBS: ${ENCODE_JOBS:-1}
      COPY_JOBS: ${COPY_JOBS:-1}
    volumes: *storage
    cpus: ${VIDEO_CPUS:-11}
    cpu_shares: 256
    oom_score_adj: 500
    stop_grace_period: 45s
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker-image:
    <<: *app
    command: ["nice", "-n", "10", "node", "dist/main.js"]
    environment:
      <<: *app-env
      ROLE: worker-image
      IMAGE_JOBS: ${IMAGE_JOBS:-2}
    volumes: *storage
    cpus: ${IMAGE_CPUS:-4}
    cpu_shares: 256
    oom_score_adj: 500
    stop_grace_period: 45s
    depends_on:
      migrate:
        condition: service_completed_successfully

  proxy:
    image: contentops-proxy:local
    build:
      context: .
      target: proxy
    restart: unless-stopped
    networks: [stack]
    environment:
      TZ: UTC
    ports:
      - 127.0.0.1:${PROXY_PORT:-8080}:8080
    volumes:
      - ./ops/nginx/contentops.conf:/etc/nginx/conf.d/default.conf:ro
      - ${DATA_ROOT:-/srv/content}:/srv/content:ro
      - ${DERIVED_ROOT:-/srv/derived}:/srv/derived:ro
      - ${TMP_ROOT:-/srv/tmp}:/srv/tmp:ro
    depends_on:
      - web

networks:
  stack:
    ipam:
      config:
        - subnet: ${STACK_SUBNET:-10.77.10.0/24}
