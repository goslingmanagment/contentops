# nginx of the stack (SPEC §12.0 «Прокси и TLS», §12.1): the only published port, loopback
# 127.0.0.1:8080 on the host (docker-compose.yml). In front of it: `tailscale serve` on the
# pilot, certbot on the server. Serves the interface (SPA with history fallback), proxies
# `/api` and `/healthz` to `web`, and sends the bytes of blobs, previews and exports that
# `web` points to with `X-Accel-Redirect` (SPEC §9.1).

# Docker DNS: `web` is looked up again after it restarts with a new address.
resolver 127.0.0.11 valid=10s ipv6=off;

map $http_x_request_id $request_id_out {
  default $http_x_request_id;
  '' $request_id;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  server_tokens off;
  sendfile on;
  tcp_nopush on;
  # Uploads and commands go to `web` as they come; `web` sets its own limits.
  client_max_body_size 0;

  # Text is compressed: the catalog index is about 1 MB of JSON and the page summary 0.6 MB
  # on the full catalog, the scripts of the build about 1 MB (docs/reference/infrastructure.md
  # §5). Media and downloads sent by X-Accel-Redirect (images, video, ZIP) keep their bytes:
  # their types are not listed. A gzipped ETag becomes weak; `web` compares weakly.
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types application/json application/problem+json application/javascript text/javascript text/css;

  set $web http://web:3000;

  location /api/ {
    proxy_pass $web;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Request-Id $request_id_out;
  }

  location = /healthz {
    proxy_pass $web;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    access_log off;
  }

  # X-Accel-Redirect targets: never reachable from outside, only as an answer of `web`.
  location /_accel/blobs/ {
    internal;
    alias /srv/content/blobs/;
  }
  location /_accel/derived/ {
    internal;
    alias /srv/derived/;
    # The address of a generation never serves other bytes (SPEC §9.1).
    add_header Cache-Control "private, max-age=31536000, immutable";
  }
  location /_accel/tmp/ {
    internal;
    alias /srv/tmp/;
  }

  # Hashed files of the Vite build never change.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Browser history (TanStack Router): every other path is the app.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
