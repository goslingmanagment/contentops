name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  # Media tests need the pinned FFmpeg/SVT-AV1 and libvips with HEIC, so they run inside the
  # product image (Dockerfile target `media-test`); `pnpm check` above runs only the pure ones.
  media:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: media-test
          load: true
          tags: contentops-media-test:ci
          cache-from: type=gha,scope=media-test
          cache-to: type=gha,scope=media-test,mode=max
      - name: Media tests in the product image
        run: docker run --rm contentops-media-test:ci
